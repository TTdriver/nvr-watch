name: Test and publish container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Test application
        run: |
          python test.py
          node web/core.test.mjs
      - name: Build and start Compose deployment
        env:
          NVR_WATCH_PORT: '18090'
        run: docker compose -f compose.build.yaml -f compose.test.yaml up --build --detach --wait --wait-timeout 120
      - name: Verify container health and persistent settings
        run: python container.test.py --url http://127.0.0.1:18090
      - name: Recreate container and verify persistence
        env:
          NVR_WATCH_PORT: '18090'
        run: |
          docker compose -f compose.build.yaml -f compose.test.yaml up --detach --force-recreate --wait --wait-timeout 120
          python container.test.py --url http://127.0.0.1:18090 --verify-persistence
      - name: Container logs on failure
        if: failure()
        run: docker compose -f compose.build.yaml -f compose.test.yaml logs | sed -E 's/(Initial administrator access code: ).*/\1[redacted]/'
      - name: Clean up test deployment
        if: always()
        run: docker compose -f compose.build.yaml -f compose.test.yaml down --volumes
  publish:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/ttdriver/nvr-watch
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
