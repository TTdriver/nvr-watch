services:
  nvr-watch:
    image: ghcr.io/ttdriver/nvr-watch:${NVR_WATCH_TAG:-1.0.0}
    restart: unless-stopped
    ports:
      - "${NVR_WATCH_PORT:-8090}:8090"
    volumes:
      - nvr-watch-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  nvr-watch-data:
